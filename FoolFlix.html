<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoolFlix</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050505;
      color: #ffffff;
      line-height: 1.5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050505; }
    button, input, select { font: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: grid; grid-template-columns: auto 1fr minmax(220px, 340px);
      align-items: center; gap: 22px; padding: 18px 34px;
      background: #050505; border-bottom: 1px solid #1e1e1e;
    }
    .brand {
      color: #ff4a4a; font-family: Georgia, "Times New Roman", serif;
      font-size: 1.72rem; font-weight: 700; text-decoration: none; letter-spacing: 0;
    }
    .nav { display: flex; align-items: center; gap: 8px; min-width: 0; overflow-x: auto; }
    .nav-button, .search button, .hero-actions button, .close-button, .load-more {
      border: 0; border-radius: 6px; padding: 10px 14px;
      background: #222222; color: #ffffff; cursor: pointer;
      text-decoration: none; white-space: nowrap;
    }
    .nav-button.is-active, .search button, .hero-actions button.primary, .load-more { background: #e50914; }
    .search { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; }
    .search input, .search select {
      min-width: 0; border: 1px solid #333333; border-radius: 6px;
      padding: 10px 12px; background: #111111; color: #ffffff;
    }
    main { min-height: calc(100vh - 78px); }
    .hero {
      min-height: 58vh; display: grid; align-items: end; padding: 64px 34px;
      background-color: #111111; background-size: cover; background-position: center;
      box-shadow: inset 0 -180px 110px #050505, inset 440px 0 180px #050505;
    }
    .hero-copy { max-width: 720px; }
    .eyebrow { color: #e50914; font-weight: 800; margin: 0 0 10px; text-transform: uppercase; }
    .hero h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 5.4rem); line-height: 0.95; }
    .hero p { color: #dddddd; }
    #hero-overview { max-width: 680px; font-size: 1.06rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .rail-section { padding: 8px 34px 42px; }
    .section-heading {
      display: flex; align-items: end; justify-content: space-between;
      gap: 16px; margin-bottom: 16px;
    }
    .section-heading h2 { margin: 0; font-size: 1.4rem; }
    .section-heading p { margin: 0; color: #a3a3a3; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(154px, 1fr)); gap: 16px; }
    .card {
      display: grid; gap: 9px; border: 0; padding: 0; background: transparent;
      color: #ffffff; text-align: left; cursor: pointer;
    }
    .poster { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 7px; background: #181818; }
    .card-title { min-height: 2.8em; margin: 0; color: #f5f5f5; font-weight: 700; line-height: 1.25; }
    .card-meta { margin: 0; color: #a3a3a3; font-size: 0.9rem; }
    .load-row { display: grid; place-items: center; padding: 34px 0 8px; }
    .load-more[disabled] { opacity: 0.55; cursor: default; }
    .player-overlay {
      position: fixed; inset: 0; z-index: 100; display: none;
      grid-template-rows: auto 1fr; background: #000000;
    }
    .player-overlay.is-open { display: grid; }
    .player-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 16px; background: #080808; border-bottom: 1px solid #202020;
    }
    .player-title { margin: 0; font-weight: 800; }
    .player-frame { width: 100%; height: 100%; border: 0; background: #000000; }
    dialog {
      width: min(900px, calc(100vw - 26px)); border: 1px solid #303030;
      border-radius: 8px; padding: 0; background: #101010; color: #ffffff;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.72); }
    dialog[open] { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; }
    #dialog-poster { width: 100%; height: 100%; min-height: 440px; object-fit: cover; background: #181818; }
    .dialog-copy { padding: 28px; }
    .dialog-copy h2 { margin: 0 0 12px; font-size: 2rem; line-height: 1.05; }
    .dialog-copy p { color: #d6d6d6; }
    .dialog-actions { display: flex; gap: 10px; margin: 22px 0; }
    .dialog-actions button.primary {
      border: 0; border-radius: 6px; padding: 11px 16px;
      background: #e50914; color: #ffffff; cursor: pointer; font: inherit; font-weight: 800;
    }
    #dialog-stream { display: block; overflow-wrap: anywhere; color: #a3a3a3; font-size: 0.85rem; }
    #close-details { position: absolute; top: 10px; right: 10px; z-index: 2; }
    @media (max-width: 780px) {
      .topbar { grid-template-columns: 1fr; padding: 14px; }
      .hero, .rail-section { padding-left: 16px; padding-right: 16px; }
      dialog[open] { grid-template-columns: 1fr; }
      #dialog-poster { height: 360px; min-height: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">FoolFlix</a>
    <nav class="nav">
      <button class="nav-button is-active" data-feed="discover" data-type="movie" data-label="all movies">all movies</button>
      <button class="nav-button" data-feed="discover" data-type="tv" data-label="all shows">all shows</button>
      <button class="nav-button" data-feed="trending" data-type="movie" data-label="trending movies">trending</button>
      <button class="nav-button" data-feed="top-rated" data-type="movie" data-label="top rated">top rated</button>
    </nav>
    <form class="search" id="search-form">
      <select id="server-select" aria-label="server"><option value="">auto server</option></select>
      <input id="search-input" name="q" type="search" placeholder="search titles" autocomplete="off">
      <button type="submit">search</button>
    </form>
  </header>
  <main>
    <section class="hero" id="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="hero-eyebrow">loading</p>
        <h1 id="hero-title">FoolFlix</h1>
        <p id="hero-overview">pulling title data through the local backend.</p>
        <div class="hero-actions">
          <button class="primary" id="hero-stream">play</button>
          <button id="hero-details">details</button>
        </div>
      </div>
    </section>
    <section class="rail-section">
      <div class="section-heading">
        <h2 id="rail-title">all movies</h2>
        <p id="status">checking backend</p>
      </div>
      <div class="grid" id="movie-grid"></div>
      <div class="load-row"><button class="load-more" id="load-more">load more</button></div>
      <div id="scroll-sentinel"></div>
    </section>
  </main>
  <dialog id="details-dialog">
    <button class="close-button" id="close-details" aria-label="close">x</button>
    <img id="dialog-poster" alt="">
    <div class="dialog-copy">
      <p id="dialog-meta"></p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-overview"></p>
      <div class="dialog-actions"><button class="primary" id="dialog-stream-button">play</button></div>
      <code id="dialog-stream"></code>
    </div>
  </dialog>
  <section class="player-overlay" id="player-overlay" aria-hidden="true">
    <div class="player-bar">
      <p class="player-title" id="player-title">FoolFlix</p>
      <button class="close-button" id="close-player" aria-label="close player">x</button>
    </div>
    <iframe class="player-frame" id="player-frame" title="FoolFlix player" src="about:blank" allow="fullscreen; autoplay; encrypted-media; picture-in-picture"></iframe>
  </section>
  <script>
    const apiBase = "https://sfools-stuff-342b8fbbb030.herokuapp.com";
    const imageBase = "https://image.tmdb.org/t/p";
    const grid = document.querySelector("#movie-grid");
    const statusText = document.querySelector("#status");
    const railTitle = document.querySelector("#rail-title");
    const hero = document.querySelector("#hero");
    const heroEyebrow = document.querySelector("#hero-eyebrow");
    const heroTitle = document.querySelector("#hero-title");
    const heroOverview = document.querySelector("#hero-overview");
    const heroDetails = document.querySelector("#hero-details");
    const heroStream = document.querySelector("#hero-stream");
    const searchForm = document.querySelector("#search-form");
    const searchInput = document.querySelector("#search-input");
    const serverSelect = document.querySelector("#server-select");
    const dialog = document.querySelector("#details-dialog");
    const closeDetails = document.querySelector("#close-details");
    const dialogPoster = document.querySelector("#dialog-poster");
    const dialogMeta = document.querySelector("#dialog-meta");
    const dialogTitle = document.querySelector("#dialog-title");
    const dialogOverview = document.querySelector("#dialog-overview");
    const dialogStreamButton = document.querySelector("#dialog-stream-button");
    const navButtons = Array.from(document.querySelectorAll(".nav-button"));
    const loadMore = document.querySelector("#load-more");
    const sentinel = document.querySelector("#scroll-sentinel");
    const playerOverlay = document.querySelector("#player-overlay");
    const playerFrame = document.querySelector("#player-frame");
    const playerTitle = document.querySelector("#player-title");
    const closePlayer = document.querySelector("#close-player");
    let currentItems = [];
    let currentMode = "feed";
    let currentFeed = "discover";
    let currentType = "movie";
    let currentLabel = "all movies";
    let currentQuery = "";
    let currentPage = 0;
    let totalPages = 1;
    let loading = false;

    function titleFor(item) { return item.title || item.name || "untitled"; }
    function dateFor(item) { return item.release_date || item.first_air_date || ""; }
    function posterFor(item, size = "w500") { return item.poster_path ? `${imageBase}/${size}${item.poster_path}` : ""; }
    function backdropFor(item) { return item.backdrop_path ? `${imageBase}/original${item.backdrop_path}` : ""; }
    function typeFor(item) { return item.media_type || item._type || (item.first_air_date ? "tv" : "movie"); }
    function ratingFor(item) { return Number.isFinite(item.vote_average) ? item.vote_average.toFixed(1) : "n/a"; }
    function setStatus(message) { statusText.textContent = message; }
    async function getJson(path) {
      const response = await fetch(`${apiBase}${path}`);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `request failed with ${response.status}`);
      return data;
    }
    function renderServers(servers) {
      serverSelect.innerHTML = "";
      const auto = document.createElement("option");
      auto.value = "";
      auto.textContent = "auto server";
      serverSelect.append(auto);
      for (const server of servers || []) {
        const option = document.createElement("option");
        option.value = server.id;
        option.textContent = server.active ? server.name : `${server.name} (off)`;
        option.disabled = !server.active;
        serverSelect.append(option);
      }
    }
    function playerUrl(item) {
      const type = typeFor(item);
      const params = new URLSearchParams({ tmdb: item.id, id: item.id, type });
      if (serverSelect.value) params.set("server", serverSelect.value);
      if (type === "tv") {
        params.set("s", item._season || "1");
        params.set("e", item._episode || "1");
      }
      return `${apiBase}/player?${params.toString()}`;
    }
    async function openStream(item) {
      const url = playerUrl(item);
      playerTitle.textContent = titleFor(item);
      playerFrame.src = url;
      if (dialog.open) dialog.close();
      playerOverlay.classList.add("is-open");
      playerOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }
    function renderHero(item) {
      const backdrop = backdropFor(item);
      hero.style.backgroundImage = backdrop ? `url("${backdrop}")` : "";
      heroEyebrow.textContent = `${typeFor(item)} | ${dateFor(item).slice(0, 4) || "new"} | ${ratingFor(item)}`;
      heroTitle.textContent = titleFor(item);
      heroOverview.textContent = item.overview || "no overview available yet.";
      heroDetails.onclick = () => openDetails(item);
      heroStream.onclick = () => openStream(item);
    }
    function appendGrid(items) {
      for (const item of items) {
        const card = document.createElement("button");
        const poster = document.createElement("img");
        const title = document.createElement("p");
        const meta = document.createElement("p");
        card.className = "card";
        poster.className = "poster";
        title.className = "card-title";
        meta.className = "card-meta";
        poster.src = posterFor(item);
        poster.alt = titleFor(item);
        title.textContent = titleFor(item);
        meta.textContent = `${typeFor(item)} | ${dateFor(item).slice(0, 4) || "unknown"} | ${ratingFor(item)}`;
        card.append(poster, title, meta);
        card.addEventListener("click", () => openDetails(item));
        grid.append(card);
      }
    }
    function openDetails(item) {
      dialogPoster.src = posterFor(item, "w500");
      dialogPoster.alt = titleFor(item);
      dialogMeta.textContent = `${typeFor(item)} | ${dateFor(item).slice(0, 4) || "unknown"} | ${ratingFor(item)}`;
      dialogTitle.textContent = titleFor(item);
      dialogOverview.textContent = item.overview || "no overview available yet.";
      dialogStreamButton.onclick = () => openStream(item);
      dialog.showModal();
    }
    function endpointForPage(page) {
      if (currentMode === "search") return `/api/movies/search?q=${encodeURIComponent(currentQuery)}&type=${currentType}&page=${page}`;
      if (currentFeed === "trending") return `/api/movies/trending?type=${currentType}&page=${page}`;
      if (currentFeed === "top-rated") return `/api/movies/top-rated?type=${currentType}&page=${page}`;
      return `/api/movies/discover?type=${currentType}&page=${page}`;
    }
    async function loadNextPage(reset = false) {
      if (loading) return;
      if (!reset && currentPage >= totalPages) {
        setStatus(`${currentItems.length} titles loaded`);
        return;
      }
      loading = true;
      loadMore.disabled = true;
      setStatus(reset ? "loading" : "loading more");
      if (reset) {
        currentPage = 0;
        totalPages = 1;
        currentItems = [];
        grid.replaceChildren();
      }
      const nextPage = currentPage + 1;
      const data = await getJson(endpointForPage(nextPage));
      const incoming = (data.results || []).map((item) => ({ ...item, _type: currentType })).filter((item) => {
        const mediaType = typeFor(item);
        return (mediaType === "movie" || mediaType === "tv") && item.poster_path;
      });
      totalPages = Math.min(data.total_pages || nextPage, 500);
      currentPage = nextPage;
      currentItems.push(...incoming);
      if (reset && incoming[0]) renderHero(incoming[0]);
      appendGrid(incoming);
      railTitle.textContent = currentLabel;
      loadMore.disabled = currentPage >= totalPages;
      loadMore.textContent = currentPage >= totalPages ? "all loaded" : "load more";
      loading = false;
      setStatus(`${currentItems.length} titles loaded`);
    }
    function failLoad(label, error) {
      loading = false;
      loadMore.disabled = false;
      setStatus(`${label} failed: ${error.message}`);
    }
    function setFeed(button) {
      navButtons.forEach((item) => item.classList.remove("is-active"));
      button.classList.add("is-active");
      currentMode = "feed";
      currentFeed = button.dataset.feed;
      currentType = button.dataset.type;
      currentLabel = button.dataset.label;
      currentQuery = "";
      searchInput.value = "";
      loadNextPage(true).catch((error) => failLoad("feed", error));
    }
    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;
      navButtons.forEach((item) => item.classList.remove("is-active"));
      currentMode = "search";
      currentType = "movie";
      currentQuery = query;
      currentLabel = `search: ${query}`;
      loadNextPage(true).catch((error) => failLoad("search", error));
    });
    for (const button of navButtons) button.addEventListener("click", () => setFeed(button));
    closeDetails.addEventListener("click", () => dialog.close());
    closePlayer.addEventListener("click", () => {
      closePlayer.blur();
      playerFrame.src = "about:blank";
      playerOverlay.classList.remove("is-open");
      playerOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    });
    loadMore.addEventListener("click", () => loadNextPage(false).catch((error) => failLoad("load", error)));
    new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting) && currentItems.length > 0 && !loading && currentPage < totalPages) {
        loadNextPage(false).catch((error) => failLoad("load", error));
      }
    }, { rootMargin: "700px" }).observe(sentinel);
    getJson("/api/config")
      .then((config) => {
        renderServers(config.servers);
        return loadNextPage(true);
      })
      .catch((error) => failLoad("backend", error));
  </script>
</body>
</html>
